<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klaw — AI Gateway</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a1a;--card:#1a1a2e;--card-hover:#222240;--text:#e0e0f0;--text-dim:#8888aa;
  --accent:#4ecdc4;--accent-dark:#3ba89f;--error:#ff6b6b;--success:#4ecdc4;--warning:#f0c040;
  --sidebar-w:220px;--radius:12px;--transition:0.2s ease;
  --user-bg:#1e3a5f;--assistant-bg:#1a1a2e;--code-bg:#0d1117;--tool-border:#4ecdc4;
}
html,body{height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#555}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;font-family:inherit;border:none;outline:none;transition:background var(--transition),opacity var(--transition)}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{font-family:inherit;background:#111128;color:var(--text);border:1px solid #333;border-radius:8px;padding:8px 12px;outline:none;transition:border var(--transition)}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
/* Layout */
#app{display:flex;height:100vh;width:100vw}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--card);display:flex;flex-direction:column;border-right:1px solid #222;z-index:100;transition:transform .25s ease}
#sidebar-header{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
#sidebar-header h1{font-size:1.2rem;font-weight:700;color:var(--accent)}
#sidebar-header span{font-size:1.3rem}
#sidebar nav{flex:1;padding:8px 0;overflow-y:auto}
#sidebar nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 18px;background:transparent;color:var(--text-dim);font-size:.9rem;text-align:left;border-radius:0;transition:all var(--transition)}
#sidebar nav button:hover{background:#ffffff08;color:var(--text)}
#sidebar nav button.active{background:#ffffff10;color:var(--accent);border-left:3px solid var(--accent)}
#sidebar nav button .icon{font-size:1.1rem;width:22px;text-align:center}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid #222;background:var(--card);min-height:48px}
#topbar .left{display:flex;align-items:center;gap:12px}
#hamburger{display:none;background:transparent;color:var(--text);font-size:1.4rem;padding:4px}
#topbar h2{font-size:1rem;font-weight:600}
#topbar .right{display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;border-radius:8px;font-size:.85rem;font-weight:500}
.btn-accent{background:var(--accent);color:#0a0a1a}.btn-accent:hover{background:var(--accent-dark)}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid #333}.btn-ghost:hover{background:#ffffff08;color:var(--text)}
.btn-danger{background:var(--error);color:#fff}.btn-danger:hover{background:#e05555}
#content{flex:1;overflow:hidden;position:relative}
.panel{display:none;height:100%;flex-direction:column;overflow:hidden}
.panel.active{display:flex}
#statusbar{display:flex;align-items:center;gap:12px;padding:6px 20px;border-top:1px solid #222;background:var(--card);font-size:.78rem;color:var(--text-dim)}
#statusbar .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#statusbar .dot.on{background:var(--success)}
#statusbar .dot.off{background:var(--error)}
/* Chat */
#chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;animation:fadeIn .2s ease;line-height:1.55;font-size:.92rem;word-wrap:break-word;position:relative}
.msg-user{background:var(--user-bg);border-radius:16px 16px 4px 16px;margin-left:auto}
.msg-assistant{background:var(--assistant-bg);border:1px solid #2a2a44;border-radius:16px 16px 16px 4px;margin-right:auto}
.msg .meta{font-size:.7rem;color:var(--text-dim);margin-top:6px}
.msg p{margin:4px 0}.msg ul,.msg ol{margin:4px 0 4px 20px}
.msg code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.85em;font-family:'Cascadia Code',Consolas,monospace}
.msg pre{margin:8px 0;border-radius:8px;overflow:hidden}
.msg pre code{display:block;background:var(--code-bg);padding:12px;overflow-x:auto;white-space:pre}
.msg strong{font-weight:600}.msg em{font-style:italic}
.tool-card{background:var(--code-bg);border-left:3px solid var(--tool-border);border-radius:6px;margin:8px 0;overflow:hidden}
.tool-card summary{padding:8px 12px;cursor:pointer;font-size:.85rem;color:var(--accent);user-select:none}
.tool-card summary:hover{background:#ffffff06}
.tool-card .tool-body{padding:8px 12px;font-size:.82rem;border-top:1px solid #222;color:var(--text-dim);white-space:pre-wrap;max-height:300px;overflow-y:auto}
.thinking{display:flex;align-items:center;gap:8px;padding:12px 16px;color:var(--text-dim);font-size:.88rem}
.thinking .dots span{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin:0 2px;animation:bounce .6s infinite alternate}
.thinking .dots span:nth-child(2){animation-delay:.15s}
.thinking .dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#chat-input-area{padding:12px 20px;border-top:1px solid #222;background:var(--card);display:flex;gap:10px;align-items:flex-end}
#chat-input{flex:1;resize:none;min-height:40px;max-height:150px;border-radius:12px;padding:10px 14px;font-size:.92rem;line-height:1.5;background:#111128;border:1px solid #333}
#chat-input:focus{border-color:var(--accent)}
#send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#0a0a1a;font-size:1.2rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#send-btn:hover{background:var(--accent-dark)}
/* Panels common */
.panel-scroll{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--card);border:1px solid #2a2a44;border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:border var(--transition)}
.card:hover{border-color:#444}
.card h3{font-size:.95rem;margin-bottom:8px;font-weight:600}
.card p,.card .info{font-size:.85rem;color:var(--text-dim);line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:500}
.badge-green{background:#1a3a2a;color:#4ecdc4}
.badge-red{background:#3a1a1a;color:#ff6b6b}
.badge-yellow{background:#3a3a1a;color:#f0c040}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);gap:8px;font-size:.95rem}
.empty-state .icon{font-size:2.5rem;opacity:.5}
/* Config editor */
#config-editor{width:100%;min-height:400px;font-family:'Cascadia Code',Consolas,monospace;font-size:.85rem;background:var(--code-bg);border:1px solid #333;border-radius:8px;padding:16px;resize:vertical;color:var(--text);line-height:1.6}
.config-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.config-status{font-size:.82rem;margin-left:auto}
/* Logs */
#log-container{flex:1;overflow-y:auto;padding:12px 20px;font-family:'Cascadia Code',Consolas,monospace;font-size:.82rem;line-height:1.7}
.log-entry{padding:2px 0;border-bottom:1px solid #111}
.log-info{color:#88aacc}.log-warn{color:var(--warning)}.log-error{color:var(--error)}
.log-toolbar{display:flex;gap:8px;padding:8px 20px;border-bottom:1px solid #222;align-items:center}
.log-toolbar select{font-size:.82rem;padding:4px 8px}
/* Cron form */
.form-row{display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.form-row label{font-size:.85rem;color:var(--text-dim);min-width:80px}
.form-row input,.form-row select{flex:1;min-width:120px}
/* Sessions detail */
.session-messages{max-height:300px;overflow-y:auto;background:var(--code-bg);border-radius:8px;padding:12px;margin-top:8px;font-size:.82rem}
.session-messages .sm{padding:4px 0;border-bottom:1px solid #1a1a2e}
.session-messages .sm-role{font-weight:600;color:var(--accent);font-size:.78rem}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--card);border:1px solid #333;border-radius:var(--radius);padding:24px;min-width:360px;max-width:90vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:1.1rem;margin-bottom:16px}
.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-size:.85rem;color:var(--text-dim);margin-bottom:4px}
.modal .field input{width:100%}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* Auth dialog */
#auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
#auth-overlay.hidden{display:none}
#auth-box{background:var(--card);border:1px solid #333;border-radius:var(--radius);padding:32px;text-align:center;min-width:340px}
#auth-box h2{margin-bottom:4px;font-size:1.3rem}
#auth-box p{color:var(--text-dim);font-size:.88rem;margin-bottom:20px}
#auth-box input{width:100%;margin-bottom:12px}
#auth-error{color:var(--error);font-size:.83rem;min-height:20px;margin-bottom:8px}
/* Responsive */
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #hamburger{display:block}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
  .sidebar-backdrop.show{display:block}
  .msg{max-width:95%}
  #chat-input-area{padding:8px 12px}
}
</style>
</head>
<body>
<div id="auth-overlay">
  <div id="auth-box">
    <div style="font-size:2.5rem;margin-bottom:8px">🦀</div>
    <h2>Klaw</h2>
    <p>Enter your auth token to connect</p>
    <input type="password" id="auth-token" placeholder="Auth token (leave blank if none)">
    <div id="auth-error"></div>
    <button class="btn btn-accent" style="width:100%;padding:10px" onclick="doAuth()">Connect</button>
  </div>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header"><span>🦀</span><h1>Klaw</h1></div>
    <nav>
      <button class="active" data-panel="chat"><span class="icon">💬</span>Chat</button>
      <button data-panel="channels"><span class="icon">📡</span>Channels</button>
      <button data-panel="sessions"><span class="icon">📋</span>Sessions</button>
      <button data-panel="cron"><span class="icon">⏰</span>Cron</button>
      <button data-panel="config"><span class="icon">🔧</span>Config</button>
      <button data-panel="status"><span class="icon">📊</span>Status</button>
      <button data-panel="logs"><span class="icon">📝</span>Logs</button>
    </nav>
  </div>

  <div id="main">
    <div id="topbar">
      <div class="left">
        <button id="hamburger" onclick="toggleSidebar()">☰</button>
        <h2 id="panel-title">💬 Chat</h2>
      </div>
      <div class="right">
        <button class="btn btn-ghost" onclick="openSettings()">⚙️ Settings</button>
      </div>
    </div>

    <div id="content">
      <!-- Chat Panel -->
      <div class="panel active" id="panel-chat">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <textarea id="chat-input" rows="1" placeholder="Type a message... (Shift+Enter for new line)"></textarea>
          <button id="send-btn" onclick="sendChat()">▶</button>
        </div>
      </div>

      <!-- Channels Panel -->
      <div class="panel" id="panel-channels">
        <div class="panel-scroll" id="channels-list">
          <div class="empty-state"><div class="icon">📡</div>Loading channels...</div>
        </div>
      </div>

      <!-- Sessions Panel -->
      <div class="panel" id="panel-sessions">
        <div class="panel-scroll" id="sessions-list">
          <div class="empty-state"><div class="icon">📋</div>Loading sessions...</div>
        </div>
      </div>

      <!-- Cron Panel -->
      <div class="panel" id="panel-cron">
        <div class="panel-scroll" id="cron-content">
          <div class="card">
            <h3>Add Cron Job</h3>
            <div class="form-row"><label>Schedule</label><input type="text" id="cron-schedule" placeholder="*/5 * * * *"></div>
            <div class="form-row"><label>Task</label><input type="text" id="cron-task" placeholder="Check system health"></div>
            <div class="form-row"><label>Enabled</label><select id="cron-enabled"><option value="true">Yes</option><option value="false">No</option></select></div>
            <button class="btn btn-accent" onclick="addCron()">Add Job</button>
          </div>
          <div id="cron-jobs"></div>
        </div>
      </div>

      <!-- Config Panel -->
      <div class="panel" id="panel-config">
        <div class="panel-scroll">
          <div class="config-toolbar">
            <button class="btn btn-ghost" onclick="loadConfig()">↻ Reload</button>
            <button class="btn btn-accent" onclick="saveConfig()">💾 Save</button>
            <span class="config-status" id="config-status"></span>
          </div>
          <textarea id="config-editor" spellcheck="false">Loading...</textarea>
        </div>
      </div>

      <!-- Status Panel -->
      <div class="panel" id="panel-status">
        <div class="panel-scroll" id="status-content">
          <div class="empty-state"><div class="icon">📊</div>Loading status...</div>
        </div>
      </div>

      <!-- Logs Panel -->
      <div class="panel" id="panel-logs">
        <div class="log-toolbar">
          <select id="log-filter" onchange="filterLogs()">
            <option value="all">All Levels</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
          <button class="btn btn-ghost" onclick="clearLogs()">Clear</button>
          <label style="font-size:.82rem;color:var(--text-dim);margin-left:auto"><input type="checkbox" id="log-autoscroll" checked> Auto-scroll</label>
        </div>
        <div id="log-container"></div>
      </div>
    </div>

    <div id="statusbar">
      <span>
        <span class="dot off" id="conn-dot"></span>
        <span id="conn-text">Disconnected</span>
      </span>
      <span id="status-version">v0.1.0</span>
      <span id="status-model"></span>
    </div>
  </div>
</div>

<!-- Settings Modal (hidden) -->
<div class="modal-overlay" id="settings-modal" style="display:none" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>⚙️ Settings</h2>
    <div class="field">
      <label>Gateway URL</label>
      <input type="text" id="set-url" placeholder="ws://localhost:3820/ws">
    </div>
    <div class="field">
      <label>Auth Token</label>
      <input type="password" id="set-token">
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-accent" onclick="saveSettings()">Save & Reconnect</button>
    </div>
  </div>
</div>

<script>
// ─── State ───
let ws = null, msgId = 0, pending = new Map(), connected = false;
let token = localStorage.getItem('klaw-token') || '';
let gwUrl = localStorage.getItem('klaw-url') || '';
let messages = [], logs = [], currentPanel = 'chat';
let streamingEl = null, isStreaming = false;

// ─── Auth ───
function doAuth() {
  token = document.getElementById('auth-token').value;
  localStorage.setItem('klaw-token', token);
  document.getElementById('auth-overlay').classList.add('hidden');
  connectWS();
}

// Check for auto token from server (local mode)
if (window.KLAW_AUTO_TOKEN) {
  token = window.KLAW_AUTO_TOKEN;
  localStorage.setItem('klaw-token', token);
}

// Check if we have a saved connection or auth is disabled
if (token || window.KLAW_AUTH_ENABLED === false) {
  document.getElementById('auth-overlay').classList.add('hidden');
  window.addEventListener('DOMContentLoaded', () => setTimeout(connectWS, 100));
} else {
  document.getElementById('auth-token').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
}

// ─── WebSocket ───
function getWsUrl() {
  if (gwUrl) return gwUrl;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/ws`;
}

function connectWS() {
  if (ws && ws.readyState <= 1) ws.close();
  const url = getWsUrl();
  try { ws = new WebSocket(url); } catch(e) { setConn(false); return; }

  ws.onopen = () => {
    send('connect', { auth: token || undefined }).then(r => {
      if (r && r.error) {
        setConn(false);
        document.getElementById('auth-error').textContent = r.error;
        document.getElementById('auth-overlay').classList.remove('hidden');
        return;
      }
      setConn(true);
      if (r && r.version) document.getElementById('status-version').textContent = 'v' + r.version;
      if (r && r.model) document.getElementById('status-model').textContent = '| model: ' + r.model;
      startPresence();
      if (currentPanel === 'status') loadStatus();
      if (currentPanel === 'config') loadConfig();
    });
  };

  ws.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch { return; }

    // Response to a pending request
    if (data.id && pending.has(data.id)) {
      pending.get(data.id)(data);
      pending.delete(data.id);
      return;
    }

    // Streaming chunk
    if (data.type === 'stream' || data.type === 'chunk') {
      handleStreamChunk(data);
      return;
    }

    // Stream end
    if (data.type === 'stream-end' || data.type === 'done') {
      handleStreamEnd(data);
      return;
    }

    // Tool call
    if (data.type === 'tool-call' || data.type === 'tool_call') {
      handleToolCall(data);
      return;
    }

    // Log message
    if (data.type === 'log') {
      addLog(data);
      return;
    }

    // Status update
    if (data.type === 'status-update') {
      if (currentPanel === 'status') renderStatus(data);
      return;
    }
  };

  ws.onclose = () => { setConn(false); setTimeout(connectWS, 3000); };
  ws.onerror = () => { setConn(false); };
}

function send(method, params = {}) {
  const id = String(++msgId);
  return new Promise((resolve) => {
    pending.set(id, resolve);
    try {
      ws.send(JSON.stringify({ type: 'req', method, id, params }));
    } catch {
      pending.delete(id);
      resolve({ error: 'Not connected' });
    }
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); resolve({ error: 'Timeout' }); } }, 30000);
  });
}

function setConn(on) {
  connected = on;
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  dot.className = 'dot ' + (on ? 'on' : 'off');
  txt.textContent = on ? 'Connected' : 'Disconnected';
}

let presenceInterval;
function startPresence() {
  clearInterval(presenceInterval);
  presenceInterval = setInterval(() => { if (connected) send('system-presence'); }, 25000);
}

// ─── Navigation ───
document.querySelectorAll('#sidebar nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    const panel = btn.dataset.panel;
    switchPanel(panel);
    if (window.innerWidth < 768) toggleSidebar();
  });
});

function switchPanel(panel) {
  currentPanel = panel;
  document.querySelectorAll('#sidebar nav button').forEach(b => b.classList.toggle('active', b.dataset.panel === panel));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + panel));
  const titles = { chat:'💬 Chat', channels:'📡 Channels', sessions:'📋 Sessions', cron:'⏰ Cron', config:'🔧 Config', status:'📊 Status', logs:'📝 Logs' };
  document.getElementById('panel-title').textContent = titles[panel] || panel;
  if (panel === 'status') loadStatus();
  if (panel === 'config') loadConfig();
  if (panel === 'channels') loadChannels();
  if (panel === 'sessions') loadSessions();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('show');
}

// ─── Chat ───
const chatInput = document.getElementById('chat-input');
const chatMessages = document.getElementById('chat-messages');

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + 'px';
});

document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); clearChat(); }
  if (e.key === 'Escape') closeSettings();
});

function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  chatInput.style.height = 'auto';

  // Slash commands
  if (text.startsWith('/')) {
    handleSlashCommand(text);
    return;
  }

  addMessage('user', text);
  showThinking();

  send('agent', { message: text }).then(r => {
    removeThinking();
    if (r.error) { addMessage('assistant', '❌ ' + r.error); return; }
    if (r.type === 'stream-start') return; // streaming handled via events
    const content = r.content || r.result || r.message || r.text || JSON.stringify(r);
    if (!isStreaming) addMessage('assistant', content);
  });
}

function handleSlashCommand(text) {
  const cmd = text.split(' ')[0].toLowerCase();
  const arg = text.slice(cmd.length).trim();
  switch (cmd) {
    case '/help':
      addMessage('assistant', '**Available commands:**\n- `/help` — Show this help\n- `/model [name]` — Show or switch model\n- `/new` — Clear chat history\n- `/status` — Show gateway status\n- `/clear` — Clear chat display');
      break;
    case '/new': case '/clear':
      clearChat();
      addMessage('assistant', '🗑️ Chat cleared.');
      break;
    case '/model':
      if (arg) {
        send('agent', { message: `/model ${arg}` }).then(r => {
          addMessage('assistant', r.content || r.message || 'Model updated.');
        });
      } else {
        addMessage('assistant', 'Current model: ' + (document.getElementById('status-model').textContent || 'unknown'));
      }
      break;
    case '/status':
      switchPanel('status');
      break;
    default:
      // Send as regular message — server might handle it
      addMessage('user', text);
      showThinking();
      send('agent', { message: text }).then(r => {
        removeThinking();
        const content = r.content || r.result || r.message || r.text || JSON.stringify(r);
        if (!isStreaming) addMessage('assistant', content);
      });
  }
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  div.innerHTML = renderMarkdown(String(content));
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = new Date().toLocaleTimeString();
  div.appendChild(meta);
  chatMessages.appendChild(div);
  scrollChat();
  return div;
}

function showThinking() {
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinking-indicator';
  div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div> Thinking...';
  chatMessages.appendChild(div);
  scrollChat();
}

function removeThinking() {
  const el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

function handleStreamChunk(data) {
  removeThinking();
  const text = data.content || data.text || data.chunk || '';
  if (!streamingEl) {
    streamingEl = document.createElement('div');
    streamingEl.className = 'msg msg-assistant';
    streamingEl._raw = '';
    chatMessages.appendChild(streamingEl);
    isStreaming = true;
  }
  streamingEl._raw += text;
  streamingEl.innerHTML = renderMarkdown(streamingEl._raw);
  scrollChat();
}

function handleStreamEnd(data) {
  if (streamingEl) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = new Date().toLocaleTimeString();
    streamingEl.appendChild(meta);
    streamingEl = null;
  }
  isStreaming = false;
  removeThinking();
}

function handleToolCall(data) {
  removeThinking();
  const name = data.name || data.tool || 'tool';
  const result = data.result || data.output || '';
  const details = document.createElement('details');
  details.className = 'tool-card';
  details.innerHTML = `<summary>🔧 ${escHtml(name)}</summary><div class="tool-body">${escHtml(String(result))}</div>`;
  chatMessages.appendChild(details);
  scrollChat();
}

function clearChat() { chatMessages.innerHTML = ''; messages = []; streamingEl = null; isStreaming = false; }
function scrollChat() { chatMessages.scrollTop = chatMessages.scrollHeight; }

// ─── Markdown (basic) ───
function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);
  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code class="lang-${lang}">${code}</code></pre>`);
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Line breaks (outside of pre blocks)
  html = html.replace(/\n/g, '<br>');
  // Fix <br> inside pre
  html = html.replace(/<pre><code([^>]*)>([\s\S]*?)<\/code><\/pre>/g, (m, cls, code) => {
    return `<pre><code${cls}>${code.replace(/<br>/g, '\n')}</code></pre>`;
  });
  return html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Status Panel ───
function loadStatus() {
  if (!connected) return;
  send('health').then(r => renderStatus(r));
  send('status').then(r => renderStatus(r));
}

function renderStatus(data) {
  const el = document.getElementById('status-content');
  if (!data || data.error) {
    el.innerHTML = `<div class="card"><p>⚠️ ${data?.error || 'Unable to load status'}</p></div>`;
    return;
  }
  const d = data.result || data;
  el.innerHTML = `
    <div class="card"><h3>🦀 Gateway</h3>
      <p>Version: <strong>${d.version || 'unknown'}</strong></p>
      <p>Uptime: <strong>${d.uptime || 'unknown'}</strong></p>
      <p>Status: <span class="badge badge-green">Running</span></p>
    </div>
    <div class="card"><h3>🧠 Model</h3>
      <p>Model: <strong>${d.model || 'unknown'}</strong></p>
      <p>Provider: <strong>${d.provider || 'unknown'}</strong></p>
    </div>
    <div class="card"><h3>📊 Usage</h3>
      <p>Connected clients: <strong>${d.clients || d.connected_clients || 0}</strong></p>
      <p>Active sessions: <strong>${d.sessions || d.active_sessions || 0}</strong></p>
      <p>Paired devices: <strong>${d.devices || d.paired_devices || 0}</strong></p>
      ${d.tokens_used ? `<p>Tokens used: <strong>${d.tokens_used}</strong></p>` : ''}
    </div>
    <div class="card"><h3>💻 System</h3>
      <p>OS: <strong>${d.os || 'unknown'}</strong></p>
      ${d.memory ? `<p>Memory: <strong>${d.memory}</strong></p>` : ''}
    </div>
  `;
}

// ─── Channels Panel ───
function loadChannels() {
  if (!connected) return;
  send('status').then(r => {
    const el = document.getElementById('channels-list');
    const d = r.result || r;
    const channels = d.channels || [];
    if (!channels.length) {
      el.innerHTML = `
        <div class="card"><h3>WebChat</h3><p><span class="badge badge-green">🟢 Connected</span> — You're using it now</p></div>
        <div class="card"><h3>📡 No other channels configured</h3><p class="info">Add Telegram, Discord, or other channels in your config.</p></div>
      `;
      return;
    }
    el.innerHTML = channels.map(ch => `
      <div class="card">
        <h3>${escHtml(ch.name || ch.type || 'Channel')}</h3>
        <p><span class="badge ${ch.connected ? 'badge-green' : 'badge-red'}">${ch.connected ? '🟢 Connected' : '🔴 Disconnected'}</span></p>
        ${ch.username ? `<p class="info">Username: ${escHtml(ch.username)}</p>` : ''}
        ${ch.last_activity ? `<p class="info">Last activity: ${ch.last_activity}</p>` : ''}
      </div>
    `).join('') + `<div class="card"><h3>WebChat</h3><p><span class="badge badge-green">🟢 Connected</span></p></div>`;
  });
}

// ─── Sessions Panel ───
function loadSessions() {
  if (!connected) return;
  send('status').then(r => {
    const el = document.getElementById('sessions-list');
    const d = r.result || r;
    const sessions = d.sessions_list || d.sessions_detail || [];
    if (!sessions.length && typeof d.sessions === 'number') {
      el.innerHTML = `<div class="card"><h3>Active Sessions: ${d.sessions || d.active_sessions || 0}</h3><p class="info">Session details not available via this endpoint.</p></div>`;
      return;
    }
    if (!sessions.length) {
      el.innerHTML = '<div class="empty-state"><div class="icon">📋</div>No active sessions</div>';
      return;
    }
    el.innerHTML = sessions.map((s, i) => `
      <div class="card">
        <h3>${escHtml(s.key || s.id || 'Session ' + (i+1))}</h3>
        <p class="info">Messages: ${s.message_count || s.messages || '?'} | Model: ${s.model || 'default'}</p>
        ${s.last_activity ? `<p class="info">Last activity: ${s.last_activity}</p>` : ''}
      </div>
    `).join('');
  });
}

// ─── Config Panel ───
let configLoaded = false;
function loadConfig() {
  if (!connected) return;
  send('config.get').then(r => {
    const editor = document.getElementById('config-editor');
    if (r.error) { editor.value = '// Error: ' + r.error; return; }
    const cfg = r.result || r.config || r;
    try { editor.value = JSON.stringify(cfg, null, 2); } catch { editor.value = String(cfg); }
    configLoaded = true;
    setConfigStatus('Loaded', 'var(--success)');
  });
}

function saveConfig() {
  const editor = document.getElementById('config-editor');
  let cfg;
  try { cfg = JSON.parse(editor.value); } catch(e) {
    setConfigStatus('❌ Invalid JSON: ' + e.message, 'var(--error)');
    return;
  }
  send('config.apply', { config: cfg }).then(r => {
    if (r.error) { setConfigStatus('❌ ' + r.error, 'var(--error)'); return; }
    setConfigStatus('✅ Saved!', 'var(--success)');
  });
}

function setConfigStatus(text, color) {
  const el = document.getElementById('config-status');
  el.textContent = text;
  el.style.color = color;
  setTimeout(() => { el.textContent = ''; }, 4000);
}

// ─── Cron Panel ───
function addCron() {
  const schedule = document.getElementById('cron-schedule').value.trim();
  const task = document.getElementById('cron-task').value.trim();
  const enabled = document.getElementById('cron-enabled').value === 'true';
  if (!schedule || !task) return;
  send('cron.add', { schedule, task, enabled }).then(r => {
    if (r.error) { alert('Error: ' + r.error); return; }
    document.getElementById('cron-schedule').value = '';
    document.getElementById('cron-task').value = '';
    loadCronJobs();
  });
}

function loadCronJobs() {
  send('cron.list').then(r => {
    const el = document.getElementById('cron-jobs');
    const jobs = r.result || r.jobs || [];
    if (!jobs.length) { el.innerHTML = '<div class="card"><p class="info">No cron jobs configured.</p></div>'; return; }
    el.innerHTML = jobs.map((j, i) => `
      <div class="card">
        <h3>${escHtml(j.task || j.name || 'Job ' + (i+1))}</h3>
        <p class="info">Schedule: <code>${escHtml(j.schedule || j.cron || '?')}</code></p>
        <p class="info">Status: <span class="badge ${j.enabled !== false ? 'badge-green' : 'badge-yellow'}">${j.enabled !== false ? 'Enabled' : 'Disabled'}</span></p>
        ${j.last_run ? `<p class="info">Last run: ${j.last_run}</p>` : ''}
        ${j.next_run ? `<p class="info">Next run: ${j.next_run}</p>` : ''}
      </div>
    `).join('');
  });
}

// ─── Logs Panel ───
function addLog(data) {
  const level = data.level || 'info';
  const entry = document.createElement('div');
  entry.className = `log-entry log-${level}`;
  entry.dataset.level = level;
  const time = data.time || new Date().toLocaleTimeString();
  entry.textContent = `[${time}] [${level.toUpperCase()}] ${data.message || data.msg || JSON.stringify(data)}`;
  const container = document.getElementById('log-container');
  container.appendChild(entry);
  logs.push(entry);
  if (logs.length > 1000) { logs[0].remove(); logs.shift(); }
  filterLogEntry(entry);
  if (document.getElementById('log-autoscroll').checked) container.scrollTop = container.scrollHeight;
}

function filterLogs() {
  const level = document.getElementById('log-filter').value;
  document.querySelectorAll('#log-container .log-entry').forEach(el => {
    el.style.display = (level === 'all' || el.dataset.level === level) ? '' : 'none';
  });
}

function filterLogEntry(el) {
  const level = document.getElementById('log-filter').value;
  el.style.display = (level === 'all' || el.dataset.level === level) ? '' : 'none';
}

function clearLogs() { document.getElementById('log-container').innerHTML = ''; logs = []; }

// ─── Settings Modal ───
function openSettings() {
  document.getElementById('set-url').value = gwUrl || getWsUrl();
  document.getElementById('set-token').value = token || '';
  document.getElementById('settings-modal').style.display = 'flex';
}

function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

function saveSettings() {
  gwUrl = document.getElementById('set-url').value.trim();
  token = document.getElementById('set-token').value;
  localStorage.setItem('klaw-url', gwUrl);
  localStorage.setItem('klaw-token', token);
  closeSettings();
  connectWS();
}

// ─── Init ───
window.addEventListener('load', () => {
  if (!document.getElementById('auth-overlay').classList.contains('hidden')) {
    document.getElementById('auth-token').focus();
  } else {
    chatInput.focus();
  }
});
</script>
