[workspace]
members = [
    "crates/klaw-core",
    "crates/klaw-gateway",
    "crates/klaw-agent",
    "crates/klaw-channels",
    "crates/klaw-tools",
    "crates/klaw-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ravindra Kumar <kulharir7@gmail.com>"]
license = "MIT"
repository = "https://github.com/kulharir7/klaw"
description = "Multi-channel AI gateway — OpenClaw reimagined in Rust"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP/WS server
axum = { version = "0.8", features = ["ws"] }
axum-extra = "0.10"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Async utilities
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Crypto/auth
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# Time
chrono = { version = "0.4", features = ["serde"] }

# File system
dirs = "6"

# Regex
regex = "1"

# Channels (will enable as needed)
# teloxide = { version = "0.13", features = ["macros"] }
# serenity = { version = "0.12", features = ["client", "gateway", "model"] }

# LLM
# async-openai = "0.25"
